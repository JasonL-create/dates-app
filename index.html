<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101827"><title>Quick Date Finder</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fa}*{box-sizing:border-box}body{margin:0;padding:28px 16px}.app{max-width:640px;margin:auto}.head{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{background:#172b4d;color:white;width:43px;height:43px;border-radius:12px;display:grid;place-items:center;font-size:23px}h1{font-size:24px;margin:0;letter-spacing:-.7px}p{margin:4px 0;color:#667085;font-size:13px}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:22px;box-shadow:0 6px 24px #17203308}.label{font-size:13px;font-weight:700;margin-bottom:10px;display:block}.date-row{display:flex;gap:10px;align-items:center;margin-bottom:24px}input[type=date]{flex:1;min-width:0;padding:12px;border:1px solid #d6deea;border-radius:10px;background:white;color:#172033;font:inherit}button{font:inherit;cursor:pointer}.today{padding:12px 16px;border:1px solid #d6deea;background:white;border-radius:10px;font-size:13px;font-weight:600}.presets{display:grid;gap:10px}.preset{width:100%;text-align:left;padding:16px 18px;background:#f9fafc;border:1px solid #e4e8ef;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}.preset strong{font-size:15px}.preset small{display:block;margin-top:4px;color:#667085;font-size:12px}.preset.active{border:2px solid #356bcb;background:#edf4ff;padding:15px 17px}.preset.active .mark{color:#356bcb}.mark{color:#98a2b3;font-size:20px}.results-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px}.results-head span{font-size:11px;letter-spacing:.8px;font-weight:800;color:#667085}.copy{background:#fff;border:1px solid #d6deea;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:600;color:#344054}.results{display:grid;gap:10px}.result{border-radius:12px;background:#f6f8fb;padding:17px 18px}.result-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.result-label{font-size:13px;font-weight:700}.result-date{font-size:23px;font-weight:750;letter-spacing:-.5px;margin:8px 0 4px}.result-bottom{display:flex;justify-content:space-between;font-size:12px;color:#667085}.note{font-size:12px;line-height:1.6;color:#667085;margin-top:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172033;color:white;border-radius:8px;padding:10px 16px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}.toast.show{opacity:1}@media(max-width:480px){body{padding:16px 12px}.panel{padding:16px}.result-date{font-size:21px}h1{font-size:21px}}
</style></head><body><main class="app"><div class="head"><div class="logo">▦</div><div><h1>Quick Date Finder</h1><p>Notice dates in one click</p></div></div><section class="panel"><label class="label" for="start">Starting Date</label><div class="date-row"><input id="start" type="date"><button class="today" id="today">Today</button></div><div class="label">Select a calculation</div><div class="presets" id="presets"></div><div class="results-head"><span>CALCULATED DATES</span><button class="copy" id="copyAll">Copy all</button></div><div class="results" id="results"></div><div class="note">The starting day is excluded. Mailing presets add 3 calendar days. No automatic weekend or holiday adjustment. Verify legally required deadlines and service rules before using a date in a notice.</div></section></main><div class="toast" id="toast" role="status"></div><script>
const presets=[{id:'tenant',name:'Tenant Notice to Vacate',detail:'30 days · no mailing added',dates:[['30-Day Notice',30]]},{id:'thirtyfourteen',name:'30/14',detail:'14 + 3 and 30 + 3 for mailing',dates:[['14 + 3 Mailing',17],['30 + 3 Mailing',33]]},{id:'nocause',name:'30-60-90 Day Notice',detail:'30, 60 and 90 days + 3 for mailing',dates:[['30 + 3 Mailing',33],['60 + 3 Mailing',63],['90 + 3 Mailing',93]]}];let selected='thirtyfourteen';const start=document.querySelector('#start');const pad=n=>String(n).padStart(2,'0');function localToday(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function plusDays(iso,days){const [y,m,d]=iso.split('-').map(Number);const result=new Date(Date.UTC(y,m-1,d+days));return result}const format=d=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',month:'long',day:'numeric',year:'numeric'}).format(d);const weekday=d=>new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'long'}).format(d);function rows(){const p=presets.find(x=>x.id===selected);return p.dates.map(([label,days])=>({label,days,date:plusDays(start.value||localToday(),days)}))}function render(){document.querySelector('#presets').innerHTML=presets.map(p=>`<button class="preset ${p.id===selected?'active':''}" data-id="${p.id}" aria-pressed="${p.id===selected}"><span><strong>${p.name}</strong><small>${p.detail}</small></span><span class="mark">${p.id===selected?'✓':'›'}</span></button>`).join('');document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()});document.querySelector('#results').innerHTML=rows().map((r,i)=>`<article class="result"><div class="result-top"><span class="result-label">${r.label}</span><button class="copy" data-copy="${i}" aria-label="Copy ${r.label} date">Copy</button></div><div class="result-date">${format(r.date)}</div><div class="result-bottom"><span>${weekday(r.date)}</span><span>+${r.days} days</span></div></article>`).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(format(rows()[Number(b.dataset.copy)].date)))}let timer;function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>el.classList.remove('show'),1800)}async function copy(value){try{await navigator.clipboard.writeText(value);toast('Copied to clipboard')}catch{const area=document.createElement('textarea');area.value=value;document.body.append(area);area.select();const ok=document.execCommand('copy');area.remove();toast(ok?'Copied to clipboard':'Unable to copy')}}document.querySelector('#copyAll').onclick=()=>copy(rows().map(r=>`${r.label}: ${format(r.date)}`).join('\n'));document.querySelector('#today').onclick=()=>{start.value=localToday();render()};start.onchange=render;start.value=localToday();render();
</script></body></html>
